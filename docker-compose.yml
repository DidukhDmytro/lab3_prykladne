services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: carservice
      POSTGRES_USER: carservice
      POSTGRES_PASSWORD: "${DB_PASSWORD:?Set DB_PASSWORD in your environment}"
    ports:
      - "5432:5432"
    volumes:
      - carservice_data:/var/lib/postgresql/data

volumes:
  carservice_data:
